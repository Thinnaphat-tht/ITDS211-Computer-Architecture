<div class="sec"><h3><i>⚠</i>ข้อหลอก ต้องแยกให้ออก<em></em></h3><div class="bd">
<ul class="l">
<li>"เร็วกว่า" = ใช้เวลา<b>น้อยกว่า</b></li>
<li>Sector = <b>ส่วนย่อยของ track</b> ไม่ใช่กลุ่มของ track</li>
<li>ตัวเลือกว่าใครได้ใช้ bus = <b>Arbitrator</b> ไม่ใช่ Control Unit</li>
<li>Daisy chain: priority ต่ำแทบไม่ได้ใช้ bus</li>
<li>Pipeline ใช้ได้ทั้ง <b>RISC และ CISC</b></li>
<li>Cache block ใหญ่ขึ้น <b>≠</b> ดีขึ้นเสมอ</li>
</ul>
</div></div>
