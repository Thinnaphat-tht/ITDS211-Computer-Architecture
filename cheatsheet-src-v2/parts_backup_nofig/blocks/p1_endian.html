<div class="sec"><h3><i>Ch03</i>Endian<em>★ สลับกันแค่นี้</em></h3><div class="bd">
<ul class="l">
<li><b>Little-Endian</b>: bit 0 (น้อยสุด) อยู่<b>ขวา</b></li>
<li><b>Big-Endian</b>: bit 0 อยู่<b>ซ้าย</b></li>
<li class="x">ตามสไลด์: Little เก็บ byte LSB ที่ address ต่ำสุด (RISC-V)</li>
</ul>
</div></div>
